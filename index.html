<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5b301">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>26度穿衣计算器 🌡️</title>
<style>
  :root {
    --bg: #fff6df;
    --card: #fffdf6;
    --ink: #5a4632;
    --ink-2: #a08a6a;
    --line: #f3e8cd;
    --primary: #f5b301;
    --primary-deep: #c98a00;
    --primary-soft: #fff1c2;
    --cold: #4f9cf9;
    --good: #35b26a;
    --good-soft: #e6f6ef;
    --hot: #ff8f3d;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    overscroll-behavior-y: contain;
    padding: max(0px, env(safe-area-inset-top)) 14px max(40px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 560px; }

  header { text-align: center; padding: clamp(12px, 3vh, 20px) 0 4px; }
  header .mascot { display: block; margin: 0 auto 4px; width: clamp(84px, 24vw, 104px); height: auto; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  header h1 { font-size: clamp(20px, 5.6vw, 24px); letter-spacing: 1px; color: var(--ink); }
  header p { color: var(--ink-2); font-size: clamp(12px, 3.4vw, 13px); margin-top: 6px; }
  header .formula-tag {
    display: inline-block; margin-top: 10px; padding: 5px 14px;
    background: var(--primary-soft); color: var(--primary-deep);
    border-radius: 999px; font-size: clamp(12px, 3.4vw, 13px); font-weight: 600;
    border: 1px dashed var(--primary);
  }

  .card {
    background: var(--card); border-radius: var(--radius);
    padding: clamp(14px, 4vw, 18px); margin-top: 12px;
    box-shadow: 0 2px 10px rgba(60,50,40,.05);
    border: 1px solid var(--line);
  }
  .card-title { font-size: clamp(14px, 3.8vw, 15px); font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

  /* ---- 温度输入 ---- */
  .temp-display { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
  .temp-display .num { font-size: clamp(44px, 14vw, 56px); font-weight: 800; color: var(--primary-deep); line-height: 1; font-variant-numeric: tabular-nums; }
  .temp-display .unit { font-size: clamp(18px, 5vw, 20px); color: var(--ink-2); }
  input[type=range] {
    width: 100%; margin-top: 18px; height: 10px; appearance: none; -webkit-appearance: none;
    background: linear-gradient(90deg, #4f9cf9, #8fd0a0 40%, #ffd166 65%, #ff8f3d 82%, #f4643c);
    border-radius: 999px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: #fff; border: 3.5px solid var(--primary);
    box-shadow: 0 2px 6px rgba(0,0,0,.18); cursor: pointer;
  }
  .scale-marks { display: flex; justify-content: space-between; color: #b3ada4; font-size: 11px; margin-top: 8px; }

  /* ---- 结果面板 ---- */
  .result { text-align: center; }
  .equation { font-size: clamp(19px, 5.6vw, 22px); font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
  .equation .val { font-variant-numeric: tabular-nums; }
  .equation .total { color: var(--primary-deep); font-size: clamp(24px, 7vw, 28px); }
  .verdict { margin-top: 10px; font-size: clamp(14px, 3.8vw, 15px); font-weight: 600; padding: 9px 16px; border-radius: 12px; display: inline-block; }
  .verdict.good { background: var(--good-soft); color: var(--good); }
  .verdict.cold { background: #eaf2fe; color: var(--cold); }
  .verdict.hot  { background: #fff2e3; color: #e07b1f; }

  /* 温度计 */
  .thermo { position: relative; height: 18px; margin: 22px 4px 6px; }
  .thermo .track {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #4f9cf9, #8fd0a0 40%, #ffd166 65%, #f4643c);
    opacity: .85;
  }
  .thermo .zone {
    position: absolute; top: -4px; height: 26px;
    border: 2px solid var(--good); border-radius: 8px;
    background: rgba(34,176,125,.15);
  }
  .thermo .marker {
    position: absolute; top: 50%; width: 18px; height: 18px;
    transform: translate(-50%, -50%);
    background: #fff; border: 3px solid var(--ink); border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    transition: left .25s ease;
  }
  .thermo-labels { display: flex; justify-content: space-between; color: #b3ada4; font-size: 11px; margin: 6px 4px 0; }
  .hint { margin-top: 12px; font-size: clamp(13px, 3.6vw, 13.5px); color: var(--ink-2); line-height: 1.6; }
  .hint b { color: var(--primary-deep); }
  .warn-badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .warn-badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #fff8e6; color: #b98a1c; border: 1px solid #f2e3ba; }

  /* ---- 衣物选择 ---- */
  .layer { margin-bottom: 16px; }
  .layer:last-child { margin-bottom: 0; }
  .layer-name { font-size: 13px; color: var(--ink-2); margin-bottom: 9px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 11px 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: #fff;
    font-size: 15px; cursor: pointer; user-select: none;
    transition: all .15s ease;
  }
  .chip .deg { font-size: 12.5px; color: #b3ada4; font-weight: 700; }
  .chip:active { transform: scale(.96); }
  .chip.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-deep); font-weight: 600; }
  .chip.on .deg { color: var(--primary-deep); opacity: .75; }
  .chip-sum { font-size: 12px; color: var(--ink-2); margin-left: 8px; }

  /* ---- 开关行 ---- */
  .toggles { display: flex; flex-wrap: wrap; gap: 9px; }
  .toggle {
    padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: #fff; font-size: 14px; cursor: pointer; user-select: none;
    transition: all .15s ease;
  }
  .toggle:active { transform: scale(.96); }
  .toggle.on { border-color: var(--primary-deep); background: var(--primary); color: #5f4300; font-weight: 600; }

  /* ---- 推荐区 ---- */
  .btn-main {
    width: 100%; padding: 16px; border: none; border-radius: 999px;
    background: linear-gradient(180deg, #ffd54d, #f5b301);
    color: #5f4300; font-size: clamp(16px, 4.4vw, 17px); font-weight: 800;
    cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(245,179,1,.45), inset 0 -3px 0 rgba(201,138,0,.55);
    transition: transform .1s ease;
  }
  .btn-main:active { transform: scale(.98); }
  .combos { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .combo {
    border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #fffef9;
  }
  .combo .items { font-size: clamp(14px, 3.8vw, 15px); line-height: 1.7; }
  .combo .items .c-deg { color: #b3ada4; font-size: 12px; }
  .combo .match { font-size: 12px; color: var(--good); font-weight: 700; white-space: nowrap; }
  .combo button {
    padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--primary);
    background: var(--primary-soft); color: var(--primary-deep); font-size: 14px; font-weight: 700; cursor: pointer;
    white-space: nowrap;
  }
  .combo button:active { background: #ffe89a; }

  footer { text-align: center; color: #b3ada4; font-size: 12px; line-height: 1.8; margin-top: 22px; }

  /* ---- 分享按钮 / 卡片弹窗 ---- */
  .btn-share {
    width: 100%; margin-top: 16px; padding: 14px;
    border-radius: 999px; border: 1.5px solid var(--primary);
    background: var(--primary-soft); color: var(--primary-deep);
    font-size: clamp(15px, 4vw, 16px); font-weight: 700; cursor: pointer;
  }
  .btn-share:active { transform: scale(.98); background: #ffe89a; }
  .overlay {
    position: fixed; inset: 0; background: rgba(70, 52, 25, .55);
    display: none; align-items: center; justify-content: center;
    z-index: 99; padding: 20px;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--card); border-radius: 20px; padding: 14px;
    width: 100%; max-width: 340px; max-height: 92dvh; overflow-y: auto;
  }
  .sheet img { width: 100%; border-radius: 14px; display: block; border: 1px solid var(--line); }
  .sheet .acts { display: flex; gap: 10px; margin-top: 14px; }
  .sheet .acts button {
    flex: 1; padding: 13px; border-radius: 999px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-save {
    border: none; background: linear-gradient(180deg, #ffd54d, #f5b301);
    color: #5f4300; box-shadow: 0 3px 10px rgba(245,179,1,.4);
  }
  .btn-native { background: #fff; border: 1.5px solid var(--primary); color: var(--primary-deep); }
  .btn-close {
    width: 100%; margin-top: 8px; padding: 10px; border: none; background: none;
    color: var(--ink-2); font-size: 14px; cursor: pointer;
  }
  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: rgba(90, 70, 50, .92); color: #fff;
    padding: 11px 20px; border-radius: 999px; font-size: 14px;
    z-index: 100; opacity: 0; transition: opacity .3s; pointer-events: none;
    max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* 桌面端：居中模拟手机宽度，加卡片底 */
  @media (min-width: 640px) {
    body { background: linear-gradient(160deg, #ffedbe, #fff6df 60%); }
  }
  @media (max-width: 359px) {
    .chip { padding: 9px 11px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <!-- 原创小黄龙吉祥物 -->
    <svg class="mascot" viewBox="0 0 120 104" aria-hidden="true">
      <!-- 尾巴 -->
      <path d="M97 70 q20 -4 16 -22 q-2 -10 -13 -9" stroke="#FFD34D" stroke-width="11" fill="none" stroke-linecap="round"/>
      <!-- 背鳍 -->
      <path d="M36 36 q-3 -9 5 -11 M55 29 q0 -10 9 -8 M76 34 q3 -9 11 -5" stroke="#FFB84D" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- 身体 -->
      <ellipse cx="60" cy="62" rx="41" ry="34" fill="#FFD34D"/>
      <!-- 肚皮 -->
      <ellipse cx="60" cy="74" rx="25" ry="18" fill="#FFF3C4"/>
      <!-- 角 -->
      <path d="M42 34 q-3 -15 9 -17 q5 9 -3 19 z" fill="#FF9E3D"/>
      <path d="M78 34 q3 -15 -9 -17 q-5 9 3 19 z" fill="#FF9E3D"/>
      <!-- 眼睛 -->
      <circle cx="47" cy="52" r="6" fill="#3b2d1a"/>
      <circle cx="73" cy="52" r="6" fill="#3b2d1a"/>
      <circle cx="49" cy="50" r="2" fill="#fff"/>
      <circle cx="75" cy="50" r="2" fill="#fff"/>
      <!-- 腮红 -->
      <ellipse cx="35" cy="62" rx="7" ry="4.5" fill="#FFB3B3" opacity=".85"/>
      <ellipse cx="85" cy="62" rx="7" ry="4.5" fill="#FFB3B3" opacity=".85"/>
      <!-- 嘴 -->
      <path d="M53 63 q7 7 14 0" stroke="#3b2d1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- 小脚 -->
      <ellipse cx="45" cy="95" rx="9" ry="5.5" fill="#FFC93D"/>
      <ellipse cx="75" cy="95" rx="9" ry="5.5" fill="#FFC93D"/>
    </svg>
    <h1>26度穿衣计算器</h1>
    <p>小黄龙陪你穿对衣 · 气温 + 衣物 = 26℃</p>
    <span class="formula-tag">26℃ − 当天气温 = 需要穿的「温度」</span>
  </header>

  <!-- 温度输入 -->
  <div class="card">
    <div class="card-title">🌡️ 今天几度？</div>
    <div class="temp-display"><span class="num" id="tempNum">14</span><span class="unit">℃</span></div>
    <input type="range" id="tempSlider" min="-10" max="35" step="1" value="14">
    <div class="scale-marks"><span>-10℃</span><span>0℃</span><span>10℃</span><span>20℃</span><span>35℃</span></div>
  </div>

  <!-- 计算结果 -->
  <div class="card result">
    <div class="equation">
      <span class="val" id="eqTemp">14℃</span> <span style="color:#b3ada4">+</span>
      <span class="val" id="eqCloth">0℃</span> <span style="color:#b3ada4">=</span>
      <span class="total" id="eqTotal">14℃</span>
    </div>
    <div class="verdict cold" id="verdict">❄️ 有点冷，再加点衣服</div>
    <div class="thermo">
      <div class="track"></div>
      <div class="zone" id="zone"></div>
      <div class="marker" id="marker"></div>
    </div>
    <div class="thermo-labels"><span>-10℃</span><span>15℃</span><span>40℃</span></div>
    <div class="hint" id="hint"></div>
    <div class="warn-badges" id="warnBadges"></div>
    <button class="btn-share" onclick="makeCard()">📸 搭配好了，生成穿搭卡片</button>
  </div>

  <!-- 衣物选择 -->
  <div class="card">
    <div class="card-title">👕 选衣服（点选你穿的）</div>
    <div id="layers"></div>
    <div class="hint" style="margin-top:10px">已选合计：<b id="selSum">0℃</b></div>
  </div>

  <!-- 个性化开关 -->
  <div class="card">
    <div class="card-title">🎚️ 个性化调整</div>
    <div class="toggles">
      <div class="toggle" id="tgCold" onclick="toggleTg('cold')">❄️ 怕冷体质（目标+2℃）</div>
      <div class="toggle" id="tgHot" onclick="toggleTg('hot')">🔥 怕热体质（目标−2℃）</div>
      <div class="toggle" id="tgWind" onclick="toggleTg('wind')">💨 大风天</div>
      <div class="toggle" id="tgRain" onclick="toggleTg('rain')">☔ 雨天</div>
    </div>
  </div>

  <!-- 推荐 -->
  <div class="card">
    <div class="card-title">✨ 不知道怎么穿？</div>
    <button class="btn-main" onclick="genCombos()">🐾 帮 我 搭</button>
    <div class="combos" id="combos"></div>
  </div>

  <footer>
    仅供参考 · 每个人体质不同，以自己体感为准<br>
    判断标准：手脚温暖、身上不出汗，就是穿对啦
  </footer>
</div>

<!-- 穿搭卡片弹窗 -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeShare()">
  <div class="sheet">
    <img id="cardImg" alt="今日穿搭卡片">
    <div class="acts">
      <button class="btn-save" id="btnSave" onclick="downloadCard()">⬇️ 保存图片</button>
      <button class="btn-native" id="btnNative" onclick="nativeShare()" style="display:none">↗️ 分享</button>
    </div>
    <button class="btn-close" onclick="closeShare()">关 闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 衣物数据（温度为经验值）
const LAYERS = [
  { name: "内搭层（贴身）", items: [
    { id: "d1", n: "薄棉毛衫", v: 1 }, { id: "t1", n: "短袖T恤", v: 1 },
    { id: "d2", n: "厚棉毛衫", v: 2 }, { id: "c2", n: "衬衫", v: 2 }, { id: "lt2", n: "长袖T恤", v: 2 },
  ]},
  { name: "中间层（保暖）", items: [
    { id: "f3", n: "抓绒衣", v: 3 }, { id: "j3", n: "薄外套", v: 3 }, { id: "wy3", n: "卫衣", v: 3 },
    { id: "ys4", n: "毛衣", v: 4 }, { id: "yl4", n: "厚羊毛衫", v: 4 }, { id: "bx4", n: "棉背心", v: 4 },
  ]},
  { name: "外套层（防风）", items: [
    { id: "fy5", n: "风衣", v: 5 }, { id: "my5", n: "厚棉衣", v: 5 },
    { id: "by7", n: "薄羽绒服", v: 7 }, { id: "nd7", n: "呢大衣", v: 7 },
    { id: "mf8", n: "厚棉服", v: 8 }, { id: "hy9", n: "厚羽绒服", v: 9 },
  ]},
];
const ALL_ITEMS = LAYERS.flatMap(l => l.items);

const state = {
  temp: 14,
  selected: new Set(),
  cold: false, hot: false, wind: false, rain: false,
};
const target = () => 26 + (state.cold ? 2 : 0) - (state.hot ? 2 : 0);

// ---------- 渲染 ----------
function renderLayers() {
  document.getElementById("layers").innerHTML = LAYERS.map(l => `
    <div class="layer">
      <div class="layer-name">${l.name}</div>
      <div class="chips">
        ${l.items.map(it => `
          <div class="chip ${state.selected.has(it.id) ? "on" : ""}" onclick="toggleItem('${it.id}')">
            ${it.n} <span class="deg">+${it.v}℃</span>
          </div>`).join("")}
      </div>
    </div>`).join("");
}

function clothSum() {
  return ALL_ITEMS.filter(i => state.selected.has(i.id)).reduce((s, i) => s + i.v, 0);
}

function render() {
  const t = state.temp, c = clothSum(), total = t + c, tg = target();
  document.getElementById("tempNum").textContent = t;
  document.getElementById("eqTemp").textContent = t + "℃";
  document.getElementById("eqCloth").textContent = c + "℃";
  document.getElementById("eqTotal").textContent = total + "℃";
  document.getElementById("selSum").textContent = c + "℃";

  // 温度计（量程 -10 ~ 40）
  const pct = v => Math.max(0, Math.min(100, (v + 10) / 50 * 100));
  document.getElementById("marker").style.left = pct(total) + "%";
  const zone = document.getElementById("zone");
  zone.style.left = pct(tg - 1) + "%";
  zone.style.width = (pct(tg + 1) - pct(tg - 1)) + "%";

  // 判定
  const verdict = document.getElementById("verdict");
  const hint = document.getElementById("hint");
  const diff = total - tg;
  if (diff < -1) {
    verdict.className = "verdict cold"; verdict.textContent = "❄️ 有点冷";
    const need = tg - total;
    const suggest = ALL_ITEMS.filter(i => !state.selected.has(i.id)).sort((a, b) => Math.abs(a.v - need) - Math.abs(b.v - need))[0];
    hint.innerHTML = `还差 <b>${need}℃</b> 的保暖量${suggest ? `，建议加一件 <b>${suggest.n}(+${suggest.v}℃)</b>` : ""}`;
  } else if (diff > 1) {
    verdict.className = "verdict hot"; verdict.textContent = "🔥 有点热";
    const worn = ALL_ITEMS.filter(i => state.selected.has(i.id)).sort((a, b) => b.v - a.v)[0];
    hint.innerHTML = `超出 <b>${diff}℃</b>${worn ? `，建议脱掉 <b>${worn.n}(−${worn.v}℃)</b>` : "，可以少穿一件"}`;
  } else {
    verdict.className = "verdict good"; verdict.textContent = "✅ 刚刚好";
    hint.innerHTML = `当前搭配正合适，目标是 <b>${tg}℃</b>，保持这样出门吧`;
  }

  // 天气提醒
  const badges = [];
  if (state.wind) badges.push("💨 大风天：建议额外加 1~2℃ 保暖衣物（围巾/帽子也管用）");
  if (state.rain) badges.push("☔ 雨天：湿度大体感更冷，建议外层选防水外套");
  document.getElementById("warnBadges").innerHTML = badges.map(b => `<div class="warn-badge">${b}</div>`).join("");
}

function toggleItem(id) {
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  renderLayers(); render();
}

function toggleTg(k) {
  if (k === "cold") { state.cold = !state.cold; if (state.cold) state.hot = false; }
  if (k === "hot")  { state.hot = !state.hot; if (state.hot) state.cold = false; }
  if (k === "wind") state.wind = !state.wind;
  if (k === "rain") state.rain = !state.rain;
  ["cold", "hot", "wind", "rain"].forEach(x =>
    document.getElementById("tg" + x[0].toUpperCase() + x.slice(1)).classList.toggle("on", state[x]));
  render();
}

document.getElementById("tempSlider").addEventListener("input", e => {
  state.temp = +e.target.value; render();
});

// ---------- 帮我搭 ----------
function genCombos() {
  const box = document.getElementById("combos");
  const need = target() - state.temp;
  if (need <= 1) {
    box.innerHTML = `<div class="combo"><div class="items">今天很暖和，一件 <b>短袖T恤(+1℃)</b> 或薄长袖就够了 🌞</div></div>`;
    return;
  }
  const outer = LAYERS[2].items, mid = LAYERS[1].items, inner = LAYERS[0].items;
  // 内搭组合：单件 + 两件不同款
  const innerCombos = inner.map(i => [i]);
  for (let a = 0; a < inner.length; a++)
    for (let b = a + 1; b < inner.length; b++)
      innerCombos.push([inner[a], inner[b]]);

  const results = [];
  for (const o of [...outer, { id: "", n: "", v: 0 }]) {  // 温暖天气可以不穿外套
    for (const m of [...mid, { id: "", n: "", v: 0 }]) {   // 中层可不穿
      for (const ins of innerCombos) {
        const parts = [o, m, ...ins].filter(p => p.id);
        if (!parts.length) continue;
        results.push({ parts, sum: parts.reduce((s, p) => s + p.v, 0) });
      }
    }
  }
  // 打分：越接近目标越好，衣服件数少加分
  results.forEach(r => r.score = Math.abs(r.sum - need) * 10 + r.parts.length);
  results.sort((a, b) => a.score - b.score);
  // 去重 + 外套尽量不同，最多3套
  const seen = new Set(), outers = new Set(), chosen = [], fallback = [];
  for (const r of results) {
    const key = r.parts.map(p => p.id).sort().join("|");
    if (seen.has(key)) continue;
    seen.add(key);
    if (outers.has(r.parts[0].id)) fallback.push(r);
    else { outers.add(r.parts[0].id); chosen.push(r); }
    if (chosen.length >= 3) break;
  }
  while (chosen.length < 3 && fallback.length) chosen.push(fallback.shift());
  box.innerHTML = chosen.map((r, idx) => `
    <div class="combo">
      <div class="items">${r.parts.map(p => `${p.n} <span class="c-deg">+${p.v}℃</span>`).join(" + ")}
        <div class="match">合计 +${r.sum}℃ · 差 ${Math.abs(r.sum - need)}℃</div></div>
      <button onclick="applyCombo(${idx})">选这套</button>
    </div>`).join("");
  window._combos = chosen;
}

function applyCombo(idx) {
  const combo = window._combos[idx];
  state.selected = new Set(combo.parts.map(p => p.id));
  renderLayers(); render();
  document.querySelector(".card.result").scrollIntoView({ behavior: "smooth", block: "center" });
}

// ---------- 穿搭卡片生成 ----------
function toastMsg(s) {
  const t = document.getElementById("toast");
  t.textContent = s; t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 原创小黄龙（canvas 版）
function drawDragon(ctx, cx, cy, s) {
  ctx.save();
  ctx.translate(cx - 60 * s, cy - 52 * s);
  ctx.scale(s, s);
  ctx.lineCap = "round";
  // 尾巴
  ctx.strokeStyle = "#FFD34D"; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(97, 70); ctx.quadraticCurveTo(117, 66, 113, 48); ctx.quadraticCurveTo(111, 38, 100, 39); ctx.stroke();
  // 背鳍
  ctx.strokeStyle = "#FFB84D"; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(36, 36); ctx.quadraticCurveTo(33, 27, 41, 25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(55, 29); ctx.quadraticCurveTo(55, 19, 64, 21); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(76, 34); ctx.quadraticCurveTo(79, 25, 87, 29); ctx.stroke();
  // 身体 / 肚皮
  ctx.fillStyle = "#FFD34D";
  ctx.beginPath(); ctx.ellipse(60, 62, 41, 34, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#FFF3C4";
  ctx.beginPath(); ctx.ellipse(60, 74, 25, 18, 0, 0, 7); ctx.fill();
  // 角
  ctx.fillStyle = "#FF9E3D";
  ctx.beginPath(); ctx.moveTo(42, 34); ctx.quadraticCurveTo(39, 19, 51, 17); ctx.quadraticCurveTo(56, 26, 48, 36); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(78, 34); ctx.quadraticCurveTo(81, 19, 69, 17); ctx.quadraticCurveTo(64, 26, 72, 36); ctx.closePath(); ctx.fill();
  // 眼睛
  ctx.fillStyle = "#3b2d1a";
  ctx.beginPath(); ctx.arc(47, 52, 6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(73, 52, 6, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(49, 50, 2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(75, 50, 2, 0, 7); ctx.fill();
  // 腮红
  ctx.globalAlpha = .85; ctx.fillStyle = "#FFB3B3";
  ctx.beginPath(); ctx.ellipse(35, 62, 7, 4.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(85, 62, 7, 4.5, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  // 嘴
  ctx.strokeStyle = "#3b2d1a"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(53, 63); ctx.quadraticCurveTo(60, 70, 67, 63); ctx.stroke();
  // 脚
  ctx.fillStyle = "#FFC93D";
  ctx.beginPath(); ctx.ellipse(45, 95, 9, 5.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(75, 95, 9, 5.5, 0, 0, 7); ctx.fill();
  ctx.restore();
}

let _cardDataUrl = null;

function makeCard() {
  if (clothSum() === 0) { toastMsg("先点选你穿的衣服，再生成卡片哦 🐉"); return; }

  const W = 750;
  const FONT = '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  const t = state.temp, c = clothSum(), total = t + c, tg = target();
  const diff = total - tg;
  const verdict = diff < -1 ? { txt: "❄️ 有点冷", fg: "#4f9cf9", bg: "#eaf2fe" }
    : diff > 1 ? { txt: "🔥 有点热", fg: "#e07b1f", bg: "#fff2e3" }
    : { txt: "✅ 刚刚好", fg: "#35b26a", bg: "#e6f6ef" };
  const now = new Date();
  const dateStr = `${now.getMonth() + 1}月${now.getDate()}日 星期${"日一二三四五六"[now.getDay()]}`;
  const weather = [];
  if (state.wind) weather.push("💨 大风天 · 建议加 1~2℃ 保暖");
  if (state.rain) weather.push("☔ 雨天 · 湿冷体感，选防水外套");
  if (state.cold) weather.push("❄️ 怕冷体质 · 目标 " + tg + "℃");
  if (state.hot) weather.push("🔥 怕热体质 · 目标 " + tg + "℃");

  // 布局预计算
  const pad = 40, innerX = 74, innerW = W - 148;
  const groups = LAYERS.map(l => ({
    name: l.name.replace(/（.*?）/g, ""),
    items: l.items.filter(i => state.selected.has(i.id)),
  })).filter(g => g.items.length);
  let wy = 700;
  weather.forEach(w => { wy += 70; });          // 先给天气条占位
  const ly = wy + 24;                            // 分割线 y
  const rows = [];
  let cy = ly + 46;                              // 第一组标签基线
  groups.forEach(g => {
    rows.push({ type: "label", y: cy, text: g.name });
    cy += 56;
    let x = innerX;
    g.items.forEach(it => {
      ctx0.font = "600 27px " + FONT;
      const w = ctx0.measureText(`${it.n} +${it.v}℃`).width + 48;
      if (x + w > innerX + innerW) { x = innerX; cy += 74; }
      rows.push({ type: "chip", y: cy, x, w, text: `${it.n} +${it.v}℃` });
      x += w + 12;
    });
    cy += 74 + 20;
  });
  const footY = cy + 10;
  const H = footY + 150;

  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");

  // 背景 + 卡片
  ctx.fillStyle = "#fff6df"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fffdf6";
  rr(ctx, pad, pad, W - pad * 2, H - pad * 2, 40); ctx.fill();
  ctx.strokeStyle = "#f3e8cd"; ctx.lineWidth = 2; ctx.stroke();

  drawDragon(ctx, W / 2, 168, 1.5);

  ctx.textAlign = "center";
  ctx.fillStyle = "#5a4632";
  ctx.font = "800 44px " + FONT;
  ctx.fillText("今日穿搭卡片", W / 2, 300);
  ctx.fillStyle = "#a08a6a";
  ctx.font = "500 27px " + FONT;
  ctx.fillText("小黄龙陪你穿对衣 · " + dateStr, W / 2, 352);

  ctx.fillStyle = "#c98a00";
  ctx.font = "800 130px " + FONT;
  ctx.fillText(t + "℃", W / 2, 510);
  ctx.fillStyle = "#a08a6a";
  ctx.font = "500 30px " + FONT;
  ctx.fillText(`气温 ${t}℃ + 衣物 ${c}℃ = ${total}℃`, W / 2, 568);

  // 判定胶囊
  ctx.font = "700 34px " + FONT;
  const pw = ctx.measureText(verdict.txt).width + 80;
  ctx.fillStyle = verdict.bg;
  rr(ctx, W / 2 - pw / 2, 600, pw, 72, 36); ctx.fill();
  ctx.fillStyle = verdict.fg;
  ctx.fillText(verdict.txt, W / 2, 648);

  let wy2 = 700;
  weather.forEach(w => {
    ctx.font = "500 25px " + FONT;
    const ww = ctx.measureText(w).width + 52;
    ctx.fillStyle = "#fff8e6";
    rr(ctx, W / 2 - ww / 2, wy2, ww, 54, 27); ctx.fill();
    ctx.strokeStyle = "#f2e3ba"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = "#b98a1c";
    ctx.fillText(w, W / 2, wy2 + 36);
    wy2 += 70;
  });

  // 衣物清单
  ctx.strokeStyle = "#f3e8cd"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(innerX, ly - 8); ctx.lineTo(W - innerX, ly - 8); ctx.stroke();
  rows.forEach(r => {
    if (r.type === "label") {
      ctx.fillStyle = "#a08a6a"; ctx.font = "700 26px " + FONT;
      ctx.textAlign = "left"; ctx.fillText(r.text, innerX, r.y); ctx.textAlign = "center";
    } else {
      ctx.fillStyle = "#fff1c2";
      rr(ctx, r.x, r.y - 46, r.w, 60, 18); ctx.fill();
      ctx.strokeStyle = "#f5b301"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#8a5a00"; ctx.font = "600 27px " + FONT;
      ctx.textAlign = "left"; ctx.fillText(r.text, r.x + 24, r.y - 6); ctx.textAlign = "center";
    }
  });

  // 底部
  ctx.strokeStyle = "#f3e8cd";
  ctx.beginPath(); ctx.moveTo(innerX, footY); ctx.lineTo(W - innerX, footY); ctx.stroke();
  ctx.fillStyle = "#c98a00"; ctx.font = "700 28px " + FONT;
  ctx.fillText("26℃ − 气温 = 需要穿的「温度」", W / 2, footY + 52);
  ctx.fillStyle = "#b3ada4"; ctx.font = "500 22px " + FONT;
  ctx.fillText("仅供参考 · 手脚温暖不出汗就是穿对啦", W / 2, footY + 96);

  _cardDataUrl = cv.toDataURL("image/png");
  document.getElementById("cardImg").src = _cardDataUrl;
  // 移动端浏览器支持 Web Share API 时显示「分享」按钮
  const canShare = typeof navigator.share === "function" && navigator.canShare;
  document.getElementById("btnNative").style.display = canShare ? "" : "none";
  document.getElementById("overlay").classList.add("show");
}

// 占位 ctx，用于预排版权 measureText
const ctx0 = document.createElement("canvas").getContext("2d");

function downloadCard() {
  if (!_cardDataUrl) return;
  const now = new Date();
  const a = document.createElement("a");
  a.href = _cardDataUrl;
  a.download = `今日穿搭卡片-${now.getMonth() + 1}${now.getDate()}.png`;
  a.click();
  toastMsg("已保存到下载目录 📁");
}

async function nativeShare() {
  if (!_cardDataUrl) return;
  try {
    const blob = await (await fetch(_cardDataUrl)).blob();
    const file = new File([blob], "今日穿搭卡片.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "今日穿搭", text: "我今天的穿搭，26度穿衣法算出来的～" });
    } else {
      toastMsg("当前浏览器不支持直接分享，请先保存图片");
    }
  } catch (e) { /* 用户取消分享 */ }
}

function closeShare() {
  document.getElementById("overlay").classList.remove("show");
}

// 初始化
renderLayers();
render();
</script>
